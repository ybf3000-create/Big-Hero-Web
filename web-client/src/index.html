<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>大勇者 · 联机大厅</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section id="auth-view" class="auth-view">
        <div class="auth-art" aria-hidden="true">
          <div class="sun"></div>
          <div class="mountain mountain-back"></div>
          <div class="mountain mountain-front"></div>
          <div class="art-copy"><span>BIG HERO</span><strong>大勇者</strong></div>
        </div>
        <form id="auth-form" class="auth-card">
          <div class="eyebrow">WEB ONLINE · NETWORK-1</div>
          <h1 id="auth-title">进入冒险</h1>
          <p id="auth-subtitle">与伙伴一起踏上新的地图。</p>
          <label>账号<input id="username" name="username" autocomplete="username" required minlength="4" maxlength="20" pattern="[A-Za-z][A-Za-z0-9_]{3,19}"></label>
          <label>密码<input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="64"></label>
          <div id="register-fields" class="register-fields" hidden>
            <label>确认密码<input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="10" maxlength="64"></label>
            <label>邀请码<input id="invite-code" name="invite_code" autocomplete="off" maxlength="64"></label>
          </div>
          <button id="auth-submit" class="primary-button" type="submit">登录</button>
          <button id="auth-switch" class="text-button" type="button">使用邀请码注册</button>
          <p id="auth-error" class="form-error" role="alert"></p>
        </form>
      </section>

      <section id="character-view" class="character-view" hidden>
        <div class="character-panel">
          <div class="eyebrow">FIRST STEP</div>
          <h1>创建你的角色</h1>
          <p>一个账号只能拥有一个角色。</p>
          <form id="character-form">
            <label>角色名<input id="character-name" maxlength="14" autocomplete="off" required placeholder="最多7个汉字"></label>
            <button class="primary-button" type="submit">进入世界</button>
            <p id="character-error" class="form-error" role="alert"></p>
          </form>
        </div>
      </section>

      <section id="game-view" class="game-view" hidden>
        <header class="topbar">
          <div class="brand"><span class="brand-mark">勇</span><span>大勇者</span></div>
          <div class="connection"><span id="connection-dot" class="status-dot"></span><span id="connection-label">连接中</span></div>
          <div class="player-summary"><strong id="player-name">-</strong><span id="player-meta">Lv.1 · 0 EXP · 0 金币</span></div>
          <button id="logout-button" class="icon-button" type="button" title="退出登录" aria-label="退出登录">↪</button>
        </header>
        <div class="game-layout">
          <nav class="side-nav" aria-label="游戏导航">
            <button class="nav-item active" data-tab="map" type="button"><span>◈</span>地图</button>
            <button class="nav-item" data-tab="inventory" type="button"><span>▦</span>背包</button>
            <button class="nav-item" data-tab="skills" type="button"><span>✦</span>技能</button>
            <button class="nav-item" data-tab="auction" type="button"><span>◇</span>拍卖行</button>
          </nav>
          <section class="content-area">
            <div id="map-panel" class="tab-panel active">
              <div class="panel-heading"><div><span class="eyebrow">ADVENTURE MAP</span><h2>晨曦平原</h2></div><span class="location-badge">安全区域</span></div>
              <div class="map-board" aria-label="晨曦平原地图">
                <div class="map-grid"></div>
                <div class="landmark shrine"><span>✦</span><small>晨曦祭坛</small></div>
                <div class="landmark camp"><span>⌂</span><small>旅人营地</small></div>
                <div class="hero-token"><img src="./hero.png" alt="角色头像"><span id="map-player-name">勇者</span></div>
                <div class="map-route route-one"></div><div class="map-route route-two"></div>
              </div>
              <div class="map-footer"><div><span class="eyebrow">WORLD STATUS</span><strong>冒险准备就绪</strong></div><span>在线玩家 <b id="online-count">-</b> / 20</span></div>
            </div>
            <div id="inventory-panel" class="tab-panel empty-panel" hidden><span class="empty-icon">▦</span><h2>背包</h2><p>该模块正在迁移。</p></div>
            <div id="skills-panel" class="tab-panel empty-panel" hidden><span class="empty-icon">✦</span><h2>技能</h2><p>该模块正在迁移。</p></div>
            <div id="auction-panel" class="tab-panel empty-panel" hidden><span class="empty-icon">◇</span><h2>拍卖行</h2><p>交易模块正在迁移，当前不会创建或扣除任何物品与金币。</p></div>
          </section>
          <aside class="chat-panel">
            <div class="chat-heading"><div><span class="eyebrow">COMMUNITY</span><h2>世界聊天</h2></div><span id="chat-count" class="chat-count">0</span></div>
            <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
            <form id="chat-form" class="chat-form"><input id="chat-input" maxlength="120" autocomplete="off" placeholder="说点什么…"><button class="send-button" type="submit" title="发送" aria-label="发送">➤</button></form>
            <p id="chat-error" class="chat-error" role="alert"></p>
          </aside>
        </div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
